<h2>Mapa de la Ruta</h2>

<div id="map" style="height: 400px;"></div>

<button type="button" id="btn-undo" class="button">⟲ Borrar último punto</button>
<button type="button" id="btn-clear" class="button" style="margin-left:10px;">
    🗑 Borrar ruta completa
</button>

<!-- CAMPO DONDE SE GUARDA EL RECORRIDO -->
<input type="hidden" id="id_recorrido" name="recorrido">

{% block extrahead %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const observer = new MutationObserver(() => {
        const inputRecorrido = document.getElementById("id_recorrido");
        if (!inputRecorrido) return;

        observer.disconnect();
        iniciarMapa(inputRecorrido);
    });

    observer.observe(document.body, { childList: true, subtree: true });

});

function iniciarMapa(inputRecorrido) {

    const mapDiv = document.getElementById("map");
    if (mapDiv._leaflet_id) {
        mapDiv._leaflet_id = null;
    }

    const map = L.map("map").setView([-27.451389, -58.986667], 12);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19
    }).addTo(map);

    let puntos = [];
    let marcadores = [];
    let polylinea = null;

    // ======================================================
    // Cargar recorrido guardado desde Django (CORREGIDO)
    // ======================================================
    let pts = JSON.parse('{{ recorrido_json|default:"[]"|escapejs }}');

    if (Array.isArray(pts)) {
        puntos = pts;

        pts.forEach(p => {
            let m = L.marker([p[0], p[1]]).addTo(map);
            marcadores.push(m);
        });

        if (pts.length >= 2) {
            polylinea = L.polyline(puntos, { color: "blue" }).addTo(map);
            map.fitBounds(polylinea.getBounds());
        }
    }

    // ======================================================
    // Actualizar mapa y guardar JSON
    // ======================================================
    function actualizarMapa() {

        if (polylinea) {
            map.removeLayer(polylinea);
        }

        if (puntos.length >= 2) {
            polylinea = L.polyline(puntos, { color: "blue" }).addTo(map);
        }

        inputRecorrido.value = JSON.stringify(puntos);
    }

    // ======================================================
    // Click en el mapa → agregar punto
    // ======================================================
    map.on("click", function (e) {

        const lat = e.latlng.lat;
        const lng = e.latlng.lng;

        puntos.push([lat, lng]);

        let m = L.marker([lat, lng]).addTo(map);
        marcadores.push(m);

        actualizarMapa();
    });

    // ======================================================
    // Botón: borrar último punto
    // ======================================================
    document.getElementById("btn-undo").addEventListener("click", function () {

        if (puntos.length === 0) return;

        puntos.pop();
        let m = marcadores.pop();
        map.removeLayer(m);

        actualizarMapa();
    });

    // ======================================================
    // Botón: borrar ruta completa
    // ======================================================
    document.getElementById("btn-clear").addEventListener("click", function () {

        puntos = [];

        marcadores.forEach(m => map.removeLayer(m));
        marcadores = [];

        if (polylinea) {
            map.removeLayer(polylinea);
            polylinea = null;
        }

        inputRecorrido.value = "[]";
    });
}
</script>
{% endblock %}
