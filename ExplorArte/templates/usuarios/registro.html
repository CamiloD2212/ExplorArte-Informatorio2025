{% extends 'base.html' %}

{% block title %}Registrarse - ExplorArte{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5 col-lg-4">

        <div class="card p-4 shadow-lg border-0 login-card">

            <h3 class="text-center mb-4 fw-bold text-primary-custom">
                <i class="fas fa-user-plus me-2"></i> Crear cuenta
            </h3>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Revisá los datos ingresados.
                    </div>
                {% endif %}

                <!-- Usuario -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario</label>
                    <input type="text" name="username"
                           class="form-control form-control-custom"
                           required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email"
                           class="form-control form-control-custom"
                           required>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="password1"
                           class="form-control form-control-custom"
                           required>
                </div>

                <!-- Confirmar contraseña -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirmar contraseña</label>
                    <input type="password" name="password2"
                           class="form-control form-control-custom"
                           required>
                </div>

                <button type="submit" class="btn btn-primary-custom btn-lg w-100 mb-3">
                    Registrarse
                </button>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">
                    ¿Ya tenés cuenta?
                    <a href="{% url 'login' %}" class="text-primary-custom">
                        Iniciar sesión
                    </a>
                </small>
            </div>

        </div>
    </div>
</div>
{% endblock %}
