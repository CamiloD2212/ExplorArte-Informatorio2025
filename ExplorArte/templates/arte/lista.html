{% extends "base.html" %}
{% block title %}Listado de obras - ExplorArte{% endblock %}

{% block content %}
<h3 class="fw-bold text-dark mb-4 border-bottom pb-2">Explora Nuestras Obras</h3>
<div class="row">
    {% for arte in artes %}
    <div class="col-md-4 mb-4">
        <div class="card art-card h-100 shadow-sm border-0">
            <img src="{{ arte.url_imagen.url }}" class="card-img-top object-fit-cover" alt="{{ arte.titulo }}" style="height: 200px;">
            
            <div class="card-body d-flex flex-column">
                <h5 class="card-title fw-semibold text-primary-custom">{{ arte.titulo }}</h5>
                
                <p class="mb-2"><small class="text-muted">Artista: {{ arte.artista }}</small></p>
                
                <a class="btn btn-sm btn-outline-primary-custom mt-auto" href="{% url 'arte:detalle_arte' arte.id %}">
                    Ver Obra
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
