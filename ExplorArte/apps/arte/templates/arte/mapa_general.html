<!DOCTYPE html>
<html>
<head>
    <title>Mapa de Obras</title>
 
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            height: 90vh;
            width: 100%;
        }
        .popup-img {
            width: 120px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h1 style="text-align:center;">Mapa de Obras</h1>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map").setView([-27.451389, -58.986667], 12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
}).addTo(map);

const obras = [
    {% for o in obras %}
        {
            titulo: "{{ o.titulo|escapejs }}",
            artista: "{{ o.artista|escapejs }}",
            imagen: "/{{ o.url_imagen }}",
            url: "{% url 'arte_detail' o.pk %}",
            ubicacion: "{{ o.ubicacion }}",
        },
    {% endfor %}
];

obras.forEach(o => {
    if (!o.ubicacion.includes(",")) return;

    const [lat, lng] = o.ubicacion.split(",").map(Number);

    L.marker([lat, lng])
        .addTo(map)
        .bindPopup(`
            <b>${o.titulo}</b><br>
            ${o.artista}<br>
            <img src="${o.imagen}" width="120">
            <br><a href="${o.url}">Ver más</a>
        `);
});


    const params = new URLSearchParams(window.location.search);
if (params.has("centro")) {
    const [lat, lng] = params.get("centro").split(",").map(Number);
    map.setView([lat, lng], 15);
}
</script>

</body>
</html>
