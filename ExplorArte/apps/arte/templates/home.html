<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <link rel="icon" type="logo/png" href="{% static 'favicon.png' %}">

    <meta charset="UTF-8">
    <title>ExplorArte</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #4C6EF5, #15AABF);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.5rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            background: white;
            color: #4C6EF5;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #dfe6ff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ExplorArte</h1>
    <p>
        Bienvenido al panel principal.  
        Desde aquí podés explorar, registrar y visualizar obras con su ubicación geográfica.
    </p>

    <a class="btn" href="/arte/">Vista de usuario de la página</a>
    <a class="btn" href="/admin/">Administración de la página</a>
</div>

</body>
</html>
