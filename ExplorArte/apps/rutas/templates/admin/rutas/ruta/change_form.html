{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  #map {
    height: 500px;
    border: 2px solid #666;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  .btn-map {
    padding: 8px 14px;
    border-radius: 5px;
    margin-right: 10px;
    cursor: pointer;
    border: none;
  }

  #btn-undo {
    background: #4caf50;
    color: white;
  }

  #btn-clear {
    background: #e53935;
    color: white;
  }
</style>
{% endblock %}

{% block after_related_objects %}
{{ block.super }}

<h2>Mapa del recorrido (caminando)</h2>

<div id="map"></div>

<button type="button" id="btn-undo" class="btn-map">
  ⟲ Borrar último punto
</button>
<button type="button" id="btn-clear" class="btn-map">
  🗑 Borrar ruta completa
</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const inputRecorrido = document.getElementById("id_recorrido");

  if (!inputRecorrido) return;

  // ===============================
  // MAPA
  // ===============================
  const map = L.map("map").setView([-27.451389, -58.986667], 13);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19
  }).addTo(map);

  let puntos = [];
  let marcadores = [];
  let lineaRuta = null;

  // ===============================
  // CARGAR RECORRIDO GUARDADO
  // ===============================
  try {
    const data = JSON.parse(inputRecorrido.value || "[]");

    if (Array.isArray(data)) {
      puntos = data;

      puntos.forEach(p => {
        const m = L.marker([p[0], p[1]]).addTo(map);
        marcadores.push(m);
      });

      if (puntos.length >= 2) {
        dibujarRutaOSRM();
      }
    }
  } catch (e) {
    puntos = [];
  }

  // ===============================
  // FUNCIONES
  // ===============================
  function actualizarCampos() {
    inputRecorrido.value = JSON.stringify(puntos);

    const inicioLat = document.getElementById("id_inicio_lat");
    const inicioLng = document.getElementById("id_inicio_lng");
    const finLat = document.getElementById("id_fin_lat");
    const finLng = document.getElementById("id_fin_lng");

    if (puntos.length >= 1) {
      inicioLat.value = puntos[0][0];
      inicioLng.value = puntos[0][1];
    } else {
      inicioLat.value = "";
      inicioLng.value = "";
    }

    if (puntos.length >= 2) {
      const last = puntos[puntos.length - 1];
      finLat.value = last[0];
      finLng.value = last[1];
    } else {
      finLat.value = "";
      finLng.value = "";
    }
  }

  function dibujarRutaOSRM() {

    if (lineaRuta) {
      map.removeLayer(lineaRuta);
      lineaRuta = null;
    }

    if (puntos.length < 2) return;

    const coords = puntos
      .map(p => `${p[1]},${p[0]}`)
      .join(";");

    fetch(
      `https://router.project-osrm.org/route/v1/foot/${coords}?overview=full&geometries=geojson`
    )
      .then(res => res.json())
      .then(data => {
        if (!data.routes || !data.routes.length) return;

        const route = data.routes[0].geometry.coordinates;
        const latlngs = route.map(p => [p[1], p[0]]);

        lineaRuta = L.polyline(latlngs, {
          color: "blue",
          weight: 4
        }).addTo(map);

        map.fitBounds(lineaRuta.getBounds());
      });
  }

  // ===============================
  // EVENTOS
  // ===============================
  map.on("click", function (e) {

    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    puntos.push([lat, lng]);

    const m = L.marker([lat, lng]).addTo(map);
    marcadores.push(m);

    actualizarCampos();
    dibujarRutaOSRM();
  });

  document.getElementById("btn-undo").addEventListener("click", function () {

    if (!puntos.length) return;

    puntos.pop();

    const m = marcadores.pop();
    map.removeLayer(m);

    actualizarCampos();
    dibujarRutaOSRM();
  });

  document.getElementById("btn-clear").addEventListener("click", function () {

    puntos = [];

    marcadores.forEach(m => map.removeLayer(m));
    marcadores = [];

    if (lineaRuta) {
      map.removeLayer(lineaRuta);
      lineaRuta = null;
    }

    inputRecorrido.value = "[]";

    document.getElementById("id_inicio_lat").value = "";
    document.getElementById("id_inicio_lng").value = "";
    document.getElementById("id_fin_lat").value = "";
    document.getElementById("id_fin_lng").value = "";
  });

});
</script>

{% endblock %}
